<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Moroccan Startup Founders</title>
<style>
:root{--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--bg:#f8fafc;--acc:#0b3d2e}
*{box-sizing:border-box}body{margin:0;font-family:Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--acc);color:#fff;padding:40px 24px}
.wrap{max-width:1180px;margin:0 auto}
h1{margin:0 0 6px;font-size:28px;font-weight:650;letter-spacing:-.01em}
header p{margin:0;color:#b7d3c8;font-size:15px}
.bar{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0 8px;align-items:center}
input,select{padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff;color:var(--ink)}
input{flex:1;min-width:220px}
.count{color:var(--mut);font-size:13px;margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;padding-bottom:48px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;gap:14px;align-items:center}
.logo{width:48px;height:48px;border-radius:10px;border:1px solid var(--line);background:#fff;object-fit:contain;flex:none;display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--acc)}
.co{font-weight:600;font-size:16px;line-height:1.25}
.ind{color:var(--mut);font-size:12px;margin-top:2px}
.sep{height:1px;background:var(--line)}
.nm{font-weight:550;font-size:14px}.tt{color:var(--mut);font-size:13px;margin-top:2px}
a.em{font-size:13px;color:var(--ink);text-decoration:none;word-break:break-all}a.em:hover{text-decoration:underline}.links{margin-top:auto;display:flex;flex-direction:column;gap:6px}a.li{font-size:13px;color:var(--acc);text-decoration:none;font-weight:550}
a.li:hover{text-decoration:underline}
footer{color:var(--mut);font-size:12px;padding:0 0 32px}
</style></head><body>
<header><div class="wrap"><h1>Moroccan Startup Founders</h1><p>Startups and the founders behind them</p></div></header>
<div class="wrap">
<div class="bar"><input id="q" placeholder="Search founder, startup or industry"><select id="ind"><option value="">All industries</option></select></div>
<p class="count" id="count"></p><div class="grid" id="grid"></div>
<footer>Source: Lusha. </footer></div>
<script>
fetch('founders.json').then(r=>r.json()).then(data=>{
 const grid=document.getElementById('grid'),q=document.getElementById('q'),sel=document.getElementById('ind'),cnt=document.getElementById('count');
 const top=s=>(s||'').split(',')[0].trim();
 [...new Set(data.map(d=>top(d.industry)).filter(Boolean))].sort().forEach(i=>{const o=document.createElement('option');o.value=i;o.textContent=i;sel.appendChild(o)});
 const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
 function render(){const t=q.value.toLowerCase(),i=sel.value;
  const L=data.filter(d=>(!i||top(d.industry)===i)&&(!t||(d.name+d.company+d.industry+d.title+d.email).toLowerCase().includes(t)));
  cnt.textContent=L.length+' founders';
  grid.innerHTML=L.map(d=>`<div class="card"><div class="top">${d.logo?`<img class="logo" src="${esc(d.logo.replace('logos/',''))}" alt="" onerror="this.outerHTML='<div class=logo>${esc(d.company).charAt(0)}</div>'">`:`<div class="logo">${esc(d.company).charAt(0)}</div>`}<div><div class="co">${esc(d.company)}</div><div class="ind">${esc(d.industry)}</div></div></div><div class="sep"></div><div><div class="nm">${esc(d.name)}</div><div class="tt">${esc(d.title)}</div></div><div class="links">${d.email?`<a class="em" href="mailto:${esc(d.email)}">${esc(d.email)}</a>`:''}${d.linkedin?`<a class="li" href="${esc(d.linkedin)}" target="_blank" rel="noopener">LinkedIn profile</a>`:''}</div></div>`).join('')}
 q.oninput=render;sel.onchange=render;render();});
</script></body></html>
